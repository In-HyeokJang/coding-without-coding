name: Auto-open sessions by date

# 매일 아침 9시(KST)에 sessions/*.md* 를 훑어서, frontmatter의 openDate가
# 오늘(한국 시간) 이하이면서 아직 draft: true인 파일의 draft 줄을 지우고
# 커밋·푸시한다. main에 푸시되면 deploy.yml이 이어서 사이트를 다시 배포한다.
#
# main 과 dev 를 둘 다 처리한다. main만 고치면 dev에 draft: true가 남아서
# 다음 번 dev → main 병합 때 문이 다시 닫히기 때문이다.
#
# 시즌 2에도 그대로 쓴다 — 회차 파일에 draft: true / openDate: 'YYYY-MM-DD'
# 를 넣어두기만 하면 그 날짜 아침에 자동으로 열린다.
# 급하면 Actions 탭에서 Run workflow 로 직접 돌려도 된다.

on:
  schedule:
    - cron: '0 0 * * *' # 00:00 UTC = 09:00 KST (모임 당일 아침)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  open-sessions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 오늘 날짜(KST) 기준으로 draft 해제
        run: |
          TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
          echo "오늘(KST): $TODAY"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for BRANCH in main dev; do
            git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1 || continue
            git checkout -B "$BRANCH" "origin/$BRANCH"
            echo "--- $BRANCH ---"
            CHANGED=0

            for f in src/content/docs/sessions/*.md src/content/docs/sessions/*.mdx; do
              [ -f "$f" ] || continue

              OPEN_DATE=$(grep -m1 -oE '^openDate: *['"'"'"]?[0-9]{4}-[0-9]{2}-[0-9]{2}' "$f" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' || true)
              grep -qE '^draft: *true *$' "$f" || continue

              if [ -n "$OPEN_DATE" ] && [[ ! "$OPEN_DATE" > "$TODAY" ]]; then
                echo "여는 중: $f (openDate=$OPEN_DATE)"
                sed -i -E '/^draft: *true *$/d' "$f"
                CHANGED=1
              fi
            done

            if [ "$CHANGED" = "1" ]; then
              git add src/content/docs/sessions/
              git commit -m "회차 자동 공개 (날짜 도달)"
              git push origin "$BRANCH"
            else
              echo "열 회차 없음"
            fi
          done
